<title>Dilo Snipe Crosshairs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@500;700&display=swap">
<style>
/* Layout: one card per crosshair, the same head-cam scene behind each; the current one first for comparison. */
:root {
  --bg: #0b1016; --card: #121a24; --line: #26364a; --fg: #e8eef6; --muted: #8fa2b8; --yellow: #ffc832;
  --venom: #9cf05a; --pale: #d8ff8a;
  --display: "Silkscreen", "Courier New", monospace; --body: "Inter", system-ui, sans-serif;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--body); }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
h1 { font-family: var(--display); color: var(--yellow); font-size: 22px; margin: 0; letter-spacing: .04em; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
.card svg { display: block; width: 100%; height: auto; }
.cap { padding: 10px 12px 12px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.who { font-family: var(--display); font-size: 12px; letter-spacing: .06em; }
.who b { color: var(--yellow); }
.what { font-size: 12px; color: var(--muted); text-align: right; }
.now .who b { color: var(--muted); }
</style>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fb8ec"/><stop offset="1" stop-color="#cfe9fb"/></linearGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".6"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
    <symbol id="scene" viewBox="0 0 400 240">
      <rect width="400" height="130" fill="url(#sky)"/>
      <polygon points="0,130 60,70 120,95 170,60 230,110 260,130" fill="#9aa9b8"/>
      <rect y="128" width="400" height="112" fill="#5fae4e"/>
      <rect y="128" width="400" height="6" fill="#7cc463"/>
      <g fill="#6a4a30"><rect x="58" y="80" width="6" height="52"/><rect x="318" y="76" width="7" height="58"/><rect x="250" y="98" width="4" height="34"/></g>
      <g fill="#2f8a3e"><rect x="40" y="62" width="42" height="24"/><rect x="300" y="58" width="44" height="24"/><rect x="238" y="86" width="28" height="16"/></g>
      <!-- enemy at the aim point -->
      <g transform="translate(200,124)">
        <rect x="-16" y="-20" width="28" height="12" fill="#8a7a3a"/><rect x="8" y="-28" width="14" height="10" fill="#8a7a3a"/>
        <rect x="-30" y="-17" width="16" height="4" fill="#8a7a3a"/><rect x="-10" y="-9" width="4" height="9" fill="#6d5f2c"/><rect x="2" y="-9" width="4" height="9" fill="#6d5f2c"/>
      </g>
      <text x="200" y="88" font-family="Silkscreen, monospace" font-size="7" fill="#ff8a7a" text-anchor="middle">MAKO</text>
      <rect x="186" y="90" width="28" height="3" fill="#46e08a"/>
      <!-- the snout at the bottom -->
      <polygon points="150,240 180,206 220,206 250,240" fill="#4f8a5c"/>
    </symbol>
  </defs>
</svg>

<div class="wrap">
  <h1>DILO SNIPE · CROSSHAIR</h1>
  <div class="grid">

    <div class="card now">
      <svg viewBox="0 0 400 240" role="img" aria-label="Current crosshair"><use href="#scene"/>
        <g stroke="#000" stroke-opacity=".4" stroke-width="1" fill="#9cf05a">
          <rect x="176" y="118" width="14" height="3"/><rect x="210" y="118" width="14" height="3"/>
          <rect x="198.5" y="96" width="3" height="14"/><rect x="198.5" y="130" width="3" height="14"/><rect x="198" y="118" width="4" height="4"/>
        </g>
      </svg>
      <div class="cap"><span class="who"><b>NOW</b> · PLUS</span><span class="what">What's live</span></div>
    </div>

    <div class="card">
      <svg viewBox="0 0 400 240" role="img" aria-label="Dot crosshair"><use href="#scene"/>
        <circle cx="200" cy="120" r="3.2" fill="#fff" stroke="#0b1016" stroke-width="1.6"/>
      </svg>
      <div class="cap"><span class="who"><b>A</b> · DOT</span><span class="what">Just a dot, nothing in the way</span></div>
    </div>

    <div class="card">
      <svg viewBox="0 0 400 240" role="img" aria-label="Scope ring crosshair"><use href="#scene"/>
        <rect width="400" height="240" fill="url(#vig)"/>
        <circle cx="200" cy="120" r="26" fill="none" stroke="#e8f5ff" stroke-width="1.4" stroke-opacity=".9"/>
        <g stroke="#e8f5ff" stroke-width="1.4"><line x1="200" y1="88" x2="200" y2="96"/><line x1="200" y1="144" x2="200" y2="152"/><line x1="168" y1="120" x2="176" y2="120"/><line x1="224" y1="120" x2="232" y2="120"/></g>
        <circle cx="200" cy="120" r="1.6" fill="#ff5a4f"/>
      </svg>
      <div class="cap"><span class="who"><b>B</b> · SCOPE RING</span><span class="what">Thin ring, red dot, dark edges</span></div>
    </div>

    <div class="card">
      <svg viewBox="0 0 400 240" role="img" aria-label="Venom drop crosshair"><use href="#scene"/>
        <path d="M200 121 L194 110 Q200 102 206 110 Z" fill="#9cf05a" stroke="#0f2a06" stroke-width="1.2"/>
        <text x="200" y="138" font-family="Silkscreen, monospace" font-size="8" fill="#d8ff8a" text-anchor="middle" stroke="#0f2a06" stroke-width=".4">84 STUDS</text>
      </svg>
      <div class="cap"><span class="who"><b>C</b> · VENOM DROP</span><span class="what">Drop points at the spot + distance</span></div>
    </div>

    <div class="card">
      <svg viewBox="0 0 400 240" role="img" aria-label="Frill brackets crosshair"><use href="#scene"/>
        <g fill="none" stroke="#e0a03a" stroke-width="3" stroke-linecap="round"><path d="M182 104 Q172 120 182 136"/><path d="M218 104 Q228 120 218 136"/></g>
        <circle cx="200" cy="120" r="2" fill="#fff" stroke="#0b1016" stroke-width="1"/>
      </svg>
      <div class="cap"><span class="who"><b>D</b> · FRILL BRACKETS</span><span class="what">Two frill-orange brackets + dot</span></div>
    </div>

  </div>
</div>
